<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독서 성장 Map</title>
<style>
  :root {
    --navy:#163b72;
    --blue:#2563eb;
    --sky:#edf6ff;
    --bg:#f4f8fd;
    --line:#d8e5f3;
    --text:#172033;
    --muted:#667085;
    --danger:#b42318;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at top left, #dceeff 0, transparent 34%),
      linear-gradient(180deg, #eef6ff 0%, #f8fbff 45%, #f4f7fb 100%);
  }
  .shell {
    width:min(760px, 100%);
  }
  .hero {
    background:linear-gradient(135deg, var(--navy), var(--blue));
    color:white;
    border-radius:28px 28px 0 0;
    padding:38px 38px 32px;
    box-shadow:0 18px 50px rgba(23,59,114,.18);
  }
  .eyebrow {
    margin:0 0 8px;
    font-size:.85rem;
    font-weight:900;
    letter-spacing:.08em;
    opacity:.8;
  }
  h1 {
    margin:0 0 10px;
    font-size:clamp(2rem, 5vw, 3rem);
    line-height:1.15;
  }
  .hero p {
    margin:0;
    line-height:1.7;
    opacity:.94;
  }
  .card {
    background:#fff;
    border:1px solid var(--line);
    border-top:0;
    border-radius:0 0 28px 28px;
    padding:34px 38px 38px;
    box-shadow:0 18px 50px rgba(34,71,120,.08);
  }
  .guide {
    margin:0 0 24px;
    padding:15px 17px;
    border-radius:14px;
    background:var(--sky);
    color:#244f84;
    line-height:1.7;
    font-weight:700;
  }
  form {
    display:grid;
    gap:18px;
  }
  label {
    display:block;
    margin-bottom:7px;
    color:var(--navy);
    font-weight:900;
  }
  input {
    width:100%;
    padding:15px 16px;
    border:1px solid #bfd1e5;
    border-radius:13px;
    background:#fff;
    color:var(--text);
    font:inherit;
    font-size:1rem;
    outline:none;
    transition:.18s ease;
  }
  input:focus {
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(37,99,235,.10);
  }
  button {
    margin-top:4px;
    border:0;
    border-radius:14px;
    padding:16px 18px;
    background:linear-gradient(135deg, var(--navy), var(--blue));
    color:white;
    font:inherit;
    font-weight:900;
    font-size:1.05rem;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 9px 22px rgba(37,99,235,.20);
  }
  button:hover {
    transform:translateY(-1px);
    box-shadow:0 12px 26px rgba(37,99,235,.25);
  }
  button:active { transform:translateY(0); }
  .message {
    min-height:24px;
    margin:4px 0 0;
    font-weight:800;
    line-height:1.55;
  }
  .message.error { color:var(--danger); }
  .message.ok { color:#067647; }
  .footer {
    margin-top:20px;
    text-align:center;
    color:var(--muted);
    font-size:.88rem;
  }
  @media (max-width:640px) {
    body { padding:14px; align-items:flex-start; }
    .hero { padding:28px 22px 24px; }
    .card { padding:26px 22px 28px; }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">READING GROWTH MAP</p>
      <h1>나의 독서 성장 Map</h1>
      <p>학번과 이름을 입력하면 자신의 독서 성장 페이지로 이동합니다.</p>
    </section>

    <section class="card">
      <p class="guide">📚 학번과 이름을 정확하게 입력한 뒤 <strong>‘나의 Map 보기’</strong>를 눌러 주세요.</p>

      <form id="loginForm" autocomplete="off">
        <div>
          <label for="studentNumber">학번</label>
          <input
            id="studentNumber"
            name="studentNumber"
            type="text"
            inputmode="numeric"
            maxlength="5"
            placeholder="예: 10432"
            aria-describedby="message"
          >
        </div>

        <div>
          <label for="studentName">이름</label>
          <input
            id="studentName"
            name="studentName"
            type="text"
            maxlength="20"
            placeholder="예: 고양이"
            aria-describedby="message"
          >
        </div>

        <button type="submit">나의 Map 보기</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <div class="footer">독서 성장 Map</div>
    </section>
  </main>

<script>
  const students = {
      "10301": "강건우",
      "10302": "고한솔",
      "10303": "권승주",
      "10304": "김다온",
      "10305": "김승범",
      "10306": "김연호",
      "10307": "김윤호"
  };

  const form = document.getElementById("loginForm");
  const numberInput = document.getElementById("studentNumber");
  const nameInput = document.getElementById("studentName");
  const message = document.getElementById("message");

  function normalizeName(value) {
    return value.replace(/\s+/g, "").trim();
  }

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const studentNumber = numberInput.value.trim();
    const studentName = normalizeName(nameInput.value);

    if (!studentNumber || !studentName) {
      showMessage("학번과 이름을 모두 입력해 주세요.");
      return;
    }

    if (!/^\d{5}$/.test(studentNumber)) {
      showMessage("학번은 숫자 5자리로 입력해 주세요.");
      return;
    }

    const savedName = students[studentNumber];

    if (!savedName) {
      showMessage("등록된 학번을 찾을 수 없습니다. 학번을 다시 확인해 주세요.");
      return;
    }

    if (normalizeName(savedName) !== studentName) {
      showMessage("학번과 이름이 일치하지 않습니다. 다시 확인해 주세요.");
      return;
    }

    showMessage("독서 성장 Map으로 이동합니다.", "ok");

    setTimeout(() => {
      window.location.href = studentNumber + ".html";
    }, 180);
  });
</script>
</body>
</html>
